<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Steph Collection</title>

<link rel="stylesheet" href="../css/checkout.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<section class="checkout-container">

    <div class="checkout-form">

        <h2>Checkout</h2>

        <form id="checkoutForm">

            <div class="input-box">
                <label>Full Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="input-box">
                <label>Phone Number</label>
                <input type="tel" id="phone" required>
            </div>

            <div class="input-box">
                <label>Email (Optional)</label>
                <input type="email" id="email">
            </div>

            <div class="input-box">
                <label>Delivery Address</label>
                <textarea id="address" rows="4" required></textarea>
            </div>

            <div class="double-input">

                <div class="input-box">
                    <label>State</label>

                    <select id="state" required>
                        <option value="">Select State</option>
                        <option>Enugu</option>
                        <option>Lagos</option>
                        <option>Abuja</option>
                        <option>Anambra</option>
                        <option>Imo</option>
                    </select>

                </div>

                <div class="input-box">

                    <label>City</label>

                    <input type="text" id="city" required>

                </div>

            </div>

            <div class="input-box">

                <label>Order Note (Optional)</label>

                <textarea id="note" rows="3"></textarea>

            </div>

            <button type="submit" class="order-btn">
                Place Order
            </button>

        </form>

    </div>

    <div class="order-summary">

        <h2>Order Summary</h2>

        <div id="checkout-items">

        </div>

        <hr>

        <div class="summary-row">
            <span>Subtotal</span>
            <span id="checkoutSubtotal">₦0</span>
        </div>

        <div class="summary-row">
            <span>Delivery</span>
            <span id="checkoutDelivery">₦0</span>
        </div>

        <div class="summary-row total">
            <span>Total</span>
            <span id="checkoutTotal">₦0</span>
        </div>

    </div>
    


</section>
<div id="successPopup" class="success-popup">
    <div class="success-box">
        <i class="fa-solid fa-circle-check"></i>
        <h2>Order Sent Successfully!</h2>
        <p>Your order has been sent to Steph Collection on WhatsApp.</p>
        <p>
            Your Order ID:
            <strong id="successOrderId"></strong>
        </p>
        <button id="closePopupBtn">OK</button>
    </div>
</div>

<script type="module" src="../javascript/checkout.js"></script>

</body>
</html>
