<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Steph Collection - Customers</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Admin CSS -->
    <link rel="stylesheet"
        href="../css/admin.css">

</head>

<body>

    <div class="admin-container">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="admin-logo">

                <img
                    src="../images/mainLogo.png"
                    alt="Steph Collection">

            </div>


            <ul class="admin-menu">

                <li>

                    <a href="admin.html">

                        <i class="fa-solid fa-chart-line"></i>

                        Dashboard

                    </a>

                </li>


                <li>

                    <a href="admin-products.html">

                        <i class="fa-solid fa-box"></i>

                        Products

                    </a>

                </li>


                <li>

                    <a href="admin.html#orders-section">

                        <i class="fa-solid fa-cart-shopping"></i>

                        Orders

                    </a>

                </li>


                <li>

                    <a href="admin-categories.html">

                        <i class="fa-solid fa-layer-group"></i>

                        Categories

                    </a>

                </li>


                <li class="active">

                    <a href="admin-customers.html">

                        <i class="fa-solid fa-users"></i>

                        Customers

                    </a>

                </li>


                <li>

                    <a href="admin-settings.html">

                        <i class="fa-solid fa-gear"></i>

                        Settings

                    </a>

                </li>

            </ul>

        </aside>



        <!-- MAIN CONTENT -->

        <main class="admin-main">


            <!-- HEADER -->

            <header class="admin-header">

                <div>

                    <h1>Customers</h1>

                    <p>
                        View and manage your customers.
                    </p>

                </div>


                <div class="admin-profile">

                    <i class="fa-solid fa-user"></i>

                    <span>Admin</span>

                </div>

            </header>



            <!-- CUSTOMERS -->

            <section class="recent-orders">


                <div class="section-title">

                    <h2>Customers</h2>

                </div>


                <div class="orders-table-container">

                    <table class="orders-table">

                        <thead>

                            <tr>

                                <th>Customer</th>

                                <th>Phone</th>

                                <th>Email</th>

                                <th>Orders</th>

                                <th>Total Spent</th>

                                <th>Action</th>

                            </tr>

                        </thead>


                        <tbody id="customersTableBody">

                            <!-- Customers added by JavaScript -->

                        </tbody>

                    </table>


                    <div
                        class="empty-orders"
                        id="emptyCustomers">

                        <i class="fa-solid fa-users"></i>

                        <p>No customers yet.</p>

                    </div>

                </div>

            </section>


        </main>

    </div>


    <!-- Customers JavaScript -->

    <script src="../javascript/admin-customers.js"></script>

</body>

</html>
